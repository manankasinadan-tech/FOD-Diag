name: Compilation APK Android (FOD Lab Intelligence)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK & Tests Unitaires
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurer Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Générer debug.keystore si absent
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Créer .env minimal si absent
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Exécuter les tests unitaires
        run: gradle testDebugUnitTest

      - name: Compiler l'APK Debug
        run: gradle assembleDebug

      - name: Publier l'artefact APK
        uses: actions/upload-artifact@v4
        with:
          name: FOD-Lab-Intelligence-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
